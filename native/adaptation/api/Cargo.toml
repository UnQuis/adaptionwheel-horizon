[package]
name = "adaptionwheel-native"
version = "0.2.3"
edition = "2024"

[lib]
name = "adaptionwheel_native"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# Horizon target with inventory hooks (origin/main, MC 26.3-era APIs).
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "f4d8d62c31" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
