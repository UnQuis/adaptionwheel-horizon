[package]
name = "mod-adaptionwheel"
version = "0.2.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
mod_api = { package = "sunrise-mod-api", path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mod_api = { package = "sunrise-mod-api", path = ".sunrise/sdk/api/crates/sunrise-mod-api", features = ["testing"] }
